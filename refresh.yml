name: Refresh NFL data

on:
  schedule:
    - cron: "0 10 * * *"   # every morning, 10:00 UTC (early morning in the US)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install nflreadpy pandas pyarrow
      - run: python build_data.py
      - name: Commit refreshed data
        run: |
          git config user.name "data-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Refresh NFL data" && git push)
